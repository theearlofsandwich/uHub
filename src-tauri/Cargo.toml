[package]
name = "tauri-app"
version = "0.1.0"
description = "uHub: web apps like WhatsApp, Gmail and Discord in one window, each in its own isolated webview"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tokio = { version = "1", features = ["time"] }  # the hibernation timer; same tokio tauri::async_runtime runs on
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"  # the same crate as tauri::Url, for its `Host`
thiserror = "2"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
ureq = "3"  # fetching a new app's favicon (favicon.rs); rustls + ring, no system TLS needed

# Linux only: layout shim and WebKitGTK signals (see src/platform/linux.rs); versions match what tauri/wry already use
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_30"] }  # v2_20: web-process-terminated, v2_30: set_is_muted


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
